name = newsHub
summary = "NewsHub for NVDA"
description = """Reading news from various national and international news portals such as kompas.com, detik.com, and others is truly enjoyable. Aside from providing reliable information, it also broadens our knowledge as readers.
However, as we know, the web pages of these news portals are not friendly to screen readers.
There are many advertisements and complex navigation elements that make reading difficult.
That is why "NewsHub For NVDA" is here!

With this add-on, you can read news from trusted news portals easily and comfortably. In this version, the add-on supports Kompas.com (23 rubrics), Detik.com (27 rubrics), CNN Indonesia (8 rubrics), CNBC Indonesia (7 rubrics), and Tempo.co (11 rubrics), complete with cross-portal keyword search, an accessible HTML reading view with NVDA Browse Mode navigation, and inline HTML5 photo and video playback (<video> and <img>) directly inside the article view.
Happy reading!

Keyboard Shortcuts:
- NVDA+Shift+K: Open the NewsHub for NVDA dashboard from anywhere.
- Ctrl+F: Jump to the cross-portal keyword search box.
- Tab / Shift+Tab: Navigate between controls in the dashboard.
- Up / Down Arrow: Select a news site, rubric, or article title, or read article content in the HTML viewer.
- H / K / T / G / L: Navigate headings, links, tables, graphics, and lists in the HTML article reading area (NVDA Browse Mode).
- Alt+[: Navigate to the previous article in the active list.
- Alt+]: Navigate to the next article in the active list.
- F5: Refresh the article list for the active rubric or search.
- Ctrl+R: Reload the full content of the currently selected article.
- Alt+R: Return focus to the rubric selection control.
- Alt+S: Return focus to the news site selection control.
- Escape: Clear active search results and restore the default view, or contextually return to the previous stage / close the dashboard."""
author = "Aris Yohanes Elean, S.Kom"
url = https://www.kompas.com
version = 1.3.0
changelog = """Version 1.3.0:
- Added cross-portal news search by keyword across all 5 supported portals (Kompas.com, Detik.com, CNN Indonesia, CNBC Indonesia, and Tempo.co) with automatic hiding of site/rubric selectors during active search and Escape to restore the default view.
- Replaced the plain text reading area with a standard HTML article viewer supporting full NVDA Browse Mode navigation (headings, paragraphs, lists, tables, links, and media).
- Embedded article photos (<img> / <figure>) and videos (HTML5 <video controls> and embedded players) directly inline inside the HTML article reading view just like a web browser, without requiring a separate standalone video player."""
docFileName = readme.html
minimumNVDAVersion = 2022.1.0
lastTestedNVDAVersion = 2026.1.0
