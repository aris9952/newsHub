name = newsHub
summary = "NewsHub for NVDA"
description = """Reading news from various national and international news portals such as kompas.com, detik.com, and others is truly enjoyable. Not only is the news presented reliable, but it also broadens our knowledge as readers.
However, as we know, the web pages of these news portals are often not friendly to screen readers.
They are cluttered with advertisements and complex navigation that make reading difficult.
That is why "NewsHub for NVDA" is here!

With this add-on, you can read news from trusted news portals easily and comfortably. For this current version, the add-on supports kompas.com, and support for other news portals will follow soon.
Happy reading!

Keyboard Shortcuts:
- NVDA+Shift+K: Open the NewsHub for NVDA dashboard (global shortcut).
- Alt+[: Open the previous article in the active rubric (when dashboard is active).
- Alt+]: Open the next article in the active rubric (when dashboard is active).
- F5: Refresh the article list for the active rubric.
- Ctrl+R: Reload the full content of the currently selected article.
- Esc: Step back to the previous stage (Article Content -> Article List -> Rubric -> Portal) or close the dashboard."""
author = "Aris Yohanes Elean, S.Kom"
