summary = "NewsHub for NVDA"
description = """Membaca berita dari berbagai portal berita nasional maupun internasional seperti kompas.com, detik.com, dan lainnya memang sangat menyenangkan. Selain memberikan informasi yang akurat, hal tersebut juga menambah wawasan kita sebagai pembaca.
Namun seperti yang kita ketahui, halaman web dari portal-portal berita tersebut tidak ramah bagi pembaca layar.
Banyak iklan serta navigasi yang rumit sehingga menyulitkan saat membaca.
Oleh karena itu, "NewsHub For NVDA" hadir!

Dengan add-on ini, kamu dapat membaca berita dari portal-portal berita tepercaya dengan mudah dan nyaman. Pada versi ini, add-on mendukung Kompas.com (23 rubrik), Detik.com (27 rubrik), CNN Indonesia (8 rubrik), CNBC Indonesia (7 rubrik), dan Tempo.co (11 rubrik), lengkap dengan fitur pencarian berita lintas situs, tampilan baca HTML standar dengan dukungan navigasi Browse Mode NVDA layaknya peramban web, serta penampil foto (<img>) dan pemutar video HTML5 (<video>) langsung di dalam area baca artikel.
Selamat membaca!

Pintasan Keyboard:
- NVDA+Shift+K: Membuka dashboard NewsHub for NVDA dari mana saja.
- Ctrl+F: Berpindah cepat ke kotak pencarian berita lintas situs.
- Tab / Shift+Tab: Berpindah antar-kontrol di dalam dashboard.
- Panah Atas / Bawah: Memilih situs berita, rubrik, atau judul artikel, serta membaca isi artikel pada penampil HTML.
- H / K / T / G / L: Navigasi heading, tautan, tabel, grafik/foto, dan daftar pada area baca artikel HTML (Mode Jelajah / Browse Mode NVDA).
- Alt+[: Berpindah ke artikel sebelumnya pada daftar aktif.
- Alt+]: Berpindah ke artikel berikutnya pada daftar aktif.
- F5: Memperbarui daftar berita pada rubrik atau pencarian yang sedang aktif.
- Ctrl+R: Memuat ulang isi lengkap artikel yang sedang dipilih.
- Alt+R: Mengembalikan fokus ke kontrol pemilihan rubrik.
- Alt+S: Mengembalikan fokus ke kontrol pemilihan situs berita.
- Escape: Membersihkan hasil pencarian dan mengembalikan tampilan ke default, atau kembali ke tahap sebelumnya / menutup dashboard."""
changelog = """Versi 1.3.0:
- Menambahkan fitur pencarian berita berdasarkan kata kunci pada seluruh 5 situs berita (Kompas.com, Detik.com, CNN Indonesia, CNBC Indonesia, dan Tempo.co) dengan penyembunyian otomatis pilihan situs/rubrik saat hasil ditampilkan serta tombol Escape untuk kembali ke tampilan awal.
- Mengganti area baca teks biasa dengan penampil artikel HTML standar yang mendukung navigasi Browse Mode NVDA secara penuh (heading, paragraf, daftar, tabel, tautan, dan media) seperti membaca di peramban web.
- Menampilkan foto (<img> / <figure>) dan memutar video (HTML5 <video controls> serta pemutar tersemat) secara langsung di dalam tampilan baca HTML tanpa jendela pemutar video terpisah."""
